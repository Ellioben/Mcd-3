<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门点餐派 · 调度台</title>
<style>
  :root{
    --bg:#08090b;
    --surface:#0f1115;
    --surface2:#14171c;
    --surface3:#191d23;
    --line:rgba(255,255,255,.07);
    --line2:rgba(255,255,255,.12);
    --text:#e9ebee;
    --muted:#8b939d;
    --dim:#5b636d;
    --red:#da291c;
    --yellow:#ffc72c;
    --green:#34d399;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 520px at 12% -12%, rgba(218,41,28,.13), transparent 62%),
      radial-gradient(900px 480px at 92% -18%, rgba(255,199,44,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}
  ::-webkit-scrollbar-track{background:transparent}

  .app{
    height:100vh;
    display:grid;
    grid-template-columns:340px minmax(0,1fr);
    grid-template-rows:62px minmax(0,1fr) auto;
    gap:0;
  }

  /* ---------- header ---------- */
  header{
    grid-column:1 / -1;
    display:flex;align-items:center;gap:16px;
    padding:0 22px;
    border-bottom:1px solid var(--line);
    background:rgba(8,9,11,.72);
    backdrop-filter:blur(12px);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .mark{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(160deg,var(--yellow),#f0a800);
    display:grid;place-items:center;
    font-weight:800;font-size:19px;color:#241a00;
    letter-spacing:-1px;
    box-shadow:0 0 0 1px rgba(255,199,44,.25),0 4px 16px rgba(255,199,44,.16);
  }
  .brand h1{font-size:14.5px;margin:0;font-weight:600;letter-spacing:.01em}
  .brand p{font-size:11px;margin:2px 0 0;color:var(--dim);letter-spacing:.02em}

  .conn{
    margin-left:auto;
    display:flex;align-items:center;gap:7px;
    font-size:11px;color:var(--muted);
    padding:5px 11px;border:1px solid var(--line);border-radius:20px;
    background:rgba(255,255,255,.02);
    font-family:var(--mono);
  }
  .conn .pulse{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(52,211,153,.55);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}
    70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
  }

  .stats{display:flex;gap:18px;margin-right:4px}
  .stat{display:flex;flex-direction:column;gap:1px;min-width:52px}
  .stat b{font-size:13px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em}
  .stat span{font-size:9.5px;color:var(--dim);letter-spacing:.08em}

  .ctrl{display:flex;gap:6px;align-items:center}
  button{font-family:inherit;cursor:pointer;border-radius:8px;transition:.16s}
  .btn{
    background:rgba(255,255,255,.05);border:1px solid var(--line2);
    color:var(--text);font-size:12px;padding:6px 13px;
  }
  .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}
  .btn.primary:hover{background:#e63b2e;border-color:#e63b2e}
  .btn.ghost{padding:6px 9px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .btn.ghost.on{color:var(--yellow);border-color:rgba(255,199,44,.4);background:rgba(255,199,44,.08)}

  /* ---------- chat ---------- */
  .chat-col{
    display:flex;flex-direction:column;min-height:0;
    border-right:1px solid var(--line);
    background:rgba(12,14,17,.55);
  }
  .pane-head{
    display:flex;align-items:center;gap:9px;
    padding:13px 18px 11px;
    font-size:11px;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .pane-head .meta{margin-left:auto;font-family:var(--mono);letter-spacing:0;color:var(--dim);font-size:10.5px;text-transform:none}
  .pane-head .ic{width:5px;height:5px;border-radius:50%;background:var(--red)}

  .chat{flex:1;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:11px}
  .msg{max-width:88%;animation:msgIn .34s cubic-bezier(.22,.9,.28,1) both}
  @keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:rgba(218,41,28,.14);border:1px solid rgba(218,41,28,.30);color:#ffd9d4;border-radius:13px 13px 3px 13px;padding:9px 13px;font-size:12.5px;line-height:1.62}
  .msg.bot{align-self:flex-start;display:flex;gap:9px}
  .msg.bot .av{
    width:22px;height:22px;border-radius:7px;flex-shrink:0;margin-top:2px;
    background:linear-gradient(160deg,var(--yellow),#e8a000);
    color:#241a00;font-size:12px;font-weight:800;display:grid;place-items:center;
  }
  .msg.bot .bubble{
    background:var(--surface2);border:1px solid var(--line);
    border-radius:3px 13px 13px 13px;padding:9px 13px;
    font-size:12.5px;line-height:1.66;color:#d7dbe0;
  }
  .msg.bot .bubble em{color:var(--yellow);font-style:normal;font-weight:500}

  .typing{display:flex;gap:4px;padding:12px 13px;background:var(--surface2);border:1px solid var(--line);border-radius:3px 13px 13px 13px;width:fit-content}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  .chat-empty{
    margin:auto;text-align:center;color:var(--dim);font-size:12px;line-height:1.9;padding:0 20px;
  }
  .chat-empty b{color:var(--muted);font-weight:500;font-size:13px;display:block;margin-bottom:6px}

  .msg.bot.sel{cursor:pointer}
  .msg.bot.sel:hover .bubble{border-color:rgba(255,199,44,.4)}
  .msg.flash .bubble{box-shadow:0 0 0 1.5px rgba(255,199,44,.55);border-color:rgba(255,199,44,.55)}
  .tcard.hl .card{box-shadow:0 0 0 1.5px rgba(255,199,44,.5),0 0 26px rgba(255,199,44,.10);border-color:rgba(255,199,44,.45)}

  .chat-closing{
    margin:auto;text-align:center;padding:0 22px;
    animation:msgIn .4s both;
  }
  .chat-closing .cc-t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:10px}
  .chat-closing .cc-b{font-size:12.5px;line-height:1.85;color:var(--muted)}

  .report{max-width:820px;animation:cardIn .45s both}
  .rp-eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  .rp-title{font-size:19px;font-weight:600;margin:0 0 18px;letter-spacing:-.01em;line-height:1.4}
  .rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
  .kpi{background:var(--surface);padding:13px 15px}
  .kpi b{display:block;font-family:var(--mono);font-size:23px;font-weight:600;color:var(--yellow);letter-spacing:-.03em;line-height:1.15}
  .kpi span{font-size:10.5px;color:var(--dim);letter-spacing:.05em}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .bn{width:94px;font-size:11.5px;color:var(--muted);flex-shrink:0;text-align:right}
  .bt{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
  .bt i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,rgba(218,41,28,.9),rgba(255,199,44,.9));animation:barIn .85s cubic-bezier(.2,.8,.2,1) both}
  @keyframes barIn{from{width:0}}
  .bv{width:24px;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
  .rp-foot{margin-top:18px;font-size:11px;color:#454c54}

  /* ---------- flow ---------- */
  .flow-col{display:flex;flex-direction:column;min-height:0;min-width:0}
  .scenario-bar{
    display:flex;gap:6px;padding:10px 20px 0;flex-wrap:wrap;flex-shrink:0;
  }
  .tab{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    font-size:11.5px;padding:5px 11px;border-radius:7px;display:flex;align-items:center;gap:6px;
  }
  .tab:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.03)}
  .tab.active{color:var(--text);border-color:rgba(218,41,28,.55);background:rgba(218,41,28,.12)}
  .tab .idx{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
  .tab.active .idx{color:var(--red)}

  .flow-head{
    display:flex;align-items:baseline;gap:10px;padding:12px 20px 12px;flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .flow-head .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .flow-head .desc{font-size:11.5px;color:var(--muted)}
  .flow-head .meta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

  .timeline{flex:1;overflow-y:auto;padding:20px 22px 40px 20px}

  .tcard{position:relative;padding-left:30px;margin-bottom:13px;max-width:880px;animation:cardIn .38s cubic-bezier(.22,.9,.28,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .tcard::before{
    content:'';position:absolute;left:7.5px;top:24px;bottom:-15px;width:1px;
    background:linear-gradient(to bottom,var(--line2),rgba(255,255,255,.04));
  }
  .tcard:last-child::before{display:none}
  .dot{
    position:absolute;left:0;top:9px;width:16px;height:16px;border-radius:50%;
    border:1.5px solid var(--c,var(--line2));background:var(--bg);
    display:grid;place-items:center;font-size:8px;color:var(--c);
    transition:.3s;
  }
  .dot svg{opacity:0;transition:.3s}
  .tcard.done .dot{background:color-mix(in srgb,var(--c) 18%,var(--bg))}
  .tcard.done .dot svg{opacity:1}
  .tcard.running .dot{
    animation:ring 1.1s infinite;
  }
  @keyframes ring{
    0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}
    70%{box-shadow:0 0 0 7px transparent}
    100%{box-shadow:0 0 0 0 transparent}
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    transition:border-color .2s,background .2s;
  }
  .card:hover{border-color:rgba(255,255,255,.14)}
  .card.open{border-color:rgba(255,255,255,.18);background:var(--surface2)}
  .card-top{
    display:flex;align-items:center;gap:9px;
    padding:9px 12px;
    cursor:pointer;
    user-select:none;
  }
  .card-top code{
    font-family:var(--mono);font-size:12px;color:#dfe5ea;letter-spacing:-.01em;
  }
  .pill{
    font-size:9.5px;padding:1.5px 6px;border-radius:4px;
    color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 28%,transparent);
    letter-spacing:.02em;white-space:nowrap;
  }
  .lat{
    margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);
    display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .lat .ok{color:var(--green)}
  .spin{
    width:9px;height:9px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.18);border-top-color:var(--muted);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .argv{
    padding:0 12px 9px 12px;
    font-family:var(--mono);font-size:10.5px;color:var(--dim);
    letter-spacing:-.01em;line-height:1.55;
    display:none;
  }
  .card.running .argv,.card.done .argv{display:block}

  .note{
    padding:0 12px 10px 12px;font-size:11.5px;line-height:1.55;color:#9aa4b0;
    display:none;
  }
  .card.done .note{display:block}
  .note b{color:var(--yellow);font-weight:500}

  .json{
    display:none;
    border-top:1px solid var(--line);
    padding:10px 12px;
    background:rgba(0,0,0,.28);
    font-family:var(--mono);font-size:10.5px;line-height:1.62;
    color:#8f9aa6;white-space:pre;overflow-x:auto;max-height:300px;overflow-y:auto;
  }
  .card.open .json{display:block}
  .json .k{color:#6fc3f7}
  .json .s{color:#b6e3a1}
  .json .lbl{color:#4d565f;display:block;margin:0 0 3px;letter-spacing:.06em}

  .done-card{
    margin-top:6px;margin-left:30px;max-width:850px;
    border:1px solid rgba(255,199,44,.28);
    background:linear-gradient(180deg,rgba(255,199,44,.09),rgba(255,199,44,.02));
    border-radius:10px;padding:13px 15px;
    animation:cardIn .4s both;
  }
  .done-card .dt{font-size:11px;letter-spacing:.1em;color:var(--yellow);text-transform:uppercase;margin-bottom:7px}
  .done-card .dstat{font-family:var(--mono);font-size:12px;color:var(--text);margin-bottom:5px}
  .done-card .dtxt{font-size:11.5px;color:var(--muted);line-height:1.6}

  /* ---------- matrix ---------- */
  .matrix{
    grid-column:1 / -1;
    border-top:1px solid var(--line);
    background:rgba(10,12,15,.85);
    backdrop-filter:blur(12px);
    padding:11px 20px 18px;
  }
  .mx-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
  .mx-head .t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .mx-head .cov{font-family:var(--mono);font-size:11px;color:var(--yellow)}
  .mx-head .hint{margin-left:auto;font-size:10.5px;color:#454c54}
  .mx-body{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center}
  .grp{
    font-size:9.5px;color:#4a5158;letter-spacing:.06em;
    margin:0 3px 0 8px;display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .grp:first-child{margin-left:0}
  .grp::before{content:'';width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.8}
  .chip{
    font-family:var(--mono);font-size:10.5px;
    padding:3px 7px;border-radius:5px;
    background:rgba(255,255,255,.022);
    border:1px solid rgba(255,255,255,.06);
    color:#5d656e;
    transition:.28s cubic-bezier(.3,.9,.3,1);
    cursor:pointer;white-space:nowrap;
  }
  .chip:hover{color:#aab3bc;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
  .chip.on{
    color:var(--c);
    border-color:color-mix(in srgb,var(--c) 45%,transparent);
    background:color-mix(in srgb,var(--c) 11%,transparent);
  }
  .chip.on:hover{background:color-mix(in srgb,var(--c) 17%,transparent)}

  .toast{
    position:fixed;left:50%;top:74px;transform:translate(-50%,-10px);
    background:#1b1f25;border:1px solid var(--line2);
    color:var(--text);font-size:12px;padding:9px 16px;border-radius:9px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;
    box-shadow:0 12px 36px rgba(0,0,0,.55);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast b{color:var(--yellow);font-weight:500}

  @media (max-width:1000px){
    body{overflow:auto}
    .app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
    header{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}
    .conn{order:3;margin-left:0}
    .chat-col{border-right:none;border-bottom:1px solid var(--line)}
    .chat{max-height:42vh}
    .timeline{max-height:none;overflow:visible}
    .stats{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark">M</div>
      <div>
        <h1>麦门点餐派</h1>
        <p>把 35 个麦当劳 MCP 接口，编排进一次对话</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-calls">0</b><span>调用</span></div>
      <div class="stat"><b id="s-cov">0/35</b><span>覆盖</span></div>
      <div class="stat"><b id="s-lat">0ms</b><span>累计耗时</span></div>
    </div>
    <div class="ctrl">
      <button class="btn primary" id="btn-play">播放</button>
      <button class="btn ghost" id="btn-all">全流程</button>
      <button class="btn ghost" id="btn-speed">1x</button>
    </div>
    <div class="conn"><span class="pulse"></span>mcp.mcd.cn · streamablehttp</div>
  </header>

  <section class="chat-col">
    <div class="pane-head"><span class="ic"></span>对话流<span class="meta" id="chat-meta">等待开始</span></div>
    <div class="chat" id="chat">
      <div class="chat-empty"><b>选一个场景，看链路跑起来</b>左侧是用户看到的话术，<br>右侧是 Agent 在背后真实执行的 MCP 调用。</div>
    </div>
  </section>

  <section class="flow-col">
    <div class="scenario-bar" id="tabs"></div>
    <div class="flow-head">
      <span class="t">调用链</span>
      <span class="desc" id="flow-desc"></span>
      <span class="meta" id="flow-meta">0 / 0</span>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <footer class="matrix">
    <div class="mx-head">
      <span class="t">能力矩阵</span>
      <span class="cov" id="mx-cov">已点亮 0 / 35</span>
      <span class="hint">点芯片 → 跳到对应场景 · 点卡片 → 看真实入参 · 点气泡 → 高亮对应调用</span>
    </div>
    <div class="mx-body" id="chips"></div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const CATS = {
  store:   {name:'门店与时间', color:'#5aa9ff'},
  menu:    {name:'菜单商品',   color:'#ffc72c'},
  order:   {name:'下单履约',   color:'#ff6b5e'},
  delivery:{name:'地址配送',   color:'#22d3a7'},
  coupon:  {name:'优惠活动',   color:'#c084fc'},
  member:  {name:'会员积分',   color:'#f472b6'},
  lottery: {name:'抽奖',       color:'#fbbf24'},
  party:   {name:'主题派对',   color:'#38bdf8'}
};

const TOOLS = [
  ['now-time-info','store','服务器当前时间'],
  ['query-nearby-stores','store','附近门店 / 得来速'],
  ['delivery-query-stores','store','可配送门店'],
  ['query-meals','menu','门店菜单'],
  ['query-meal-detail','menu','餐品详情 / 特调'],
  ['list-nutrition-foods','menu','营养成分表'],
  ['query-promotions','menu','门店促销'],
  ['calculate-price','order','下单前试算'],
  ['create-order','order','创建订单'],
  ['query-order','order','订单详情'],
  ['order-list','order','我的订单'],
  ['cancel-order','order','取消订单'],
  ['query-meal-assistance','order','团餐助餐服务'],
  ['delivery-create-address','delivery','新增收货地址'],
  ['delivery-query-addresses','delivery','收货地址列表'],
  ['available-coupons','coupon','可领优惠券'],
  ['query-store-coupons','coupon','门店可用券'],
  ['query-my-coupons','coupon','我的优惠券'],
  ['auto-bind-coupons','coupon','自动领券绑定'],
  ['campaign-calendar','coupon','活动日历'],
  ['query-survey-coupon','coupon','问卷领券'],
  ['query-my-account','member','账户 / 积分'],
  ['mall-points-products','member','积分兑换商品'],
  ['mall-product-detail','member','商城商品详情'],
  ['mall-create-order','member','积分下单'],

/* ---------------- state ---------------- */
let cur = 0, runToken = 0, playing = false, speed = 1, called = 0, latSum = 0, aggCalls = 0, aggLat = 0;
const calledSet = new Set();

const $ = id => document.getElementById(id);
const chatEl = $('chat'), tlEl = $('timeline'), chipsEl = $('chips'), tabsEl = $('tabs');

/* ---------------- build UI ---------------- */
function buildTabs(){
  tabsEl.innerHTML = SCENARIOS.map((s,i)=>
    `<button class="tab" data-i="${i}"><span class="idx">0${i+1}</span>${s.name}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=> select(+b.dataset.i, true);
  });
}

function buildChips(){
  let html = '', lastCat = null;
  TOOLS.forEach(t=>{
    const c = CATS[t.cat];
    if(t.cat !== lastCat){
      html += `<span class="grp" style="color:${c.color}55">${c.name}</span>`;
      lastCat = t.cat;
    }
    html += `<span class="chip" data-id="${t.id}" style="--c:${c.color}" title="${t.desc}">${t.id}</span>`;
  });
  chipsEl.innerHTML = html;
  chipsEl.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick = ()=>{
      const id = ch.dataset.id;
      const idx = SCENARIOS.findIndex(s=> s.steps.some(st=> st.tool === id));
      const s = SCENARIOS[idx];
      toast(`<b>${id}</b> 出现在「${s.name}」场景`);
      select(idx, id);
    };
  });
}

function toast(html){
  const el = $('toast');
  el.innerHTML = html;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 2400);
}

/* ---------------- render helpers ---------------- */
function syncActiveTab(){
  tabsEl.querySelectorAll('.tab').forEach((b,i)=> b.classList.toggle('active', i === cur));
}

function reset(){
  runToken++;
  playing = false;
  called = 0; latSum = 0;
  chatEl.innerHTML = '';
  tlEl.innerHTML = '';
  $('s-calls').textContent = '0';
  $('s-lat').textContent = '0ms';
  $('s-cov').textContent = calledSet.size + '/35';
  $('chat-meta').textContent = '等待开始';
  $('btn-play').textContent = '播放';
}

function clearForRun(){
  reset();
  const s = SCENARIOS[cur];
  $('flow-desc').textContent = s.desc;
  $('flow-meta').textContent = `0 / ${s.steps.filter(x=>x.tool).length}`;
}

function addMsg(who, text){
  const ph = chatEl.querySelector('.chat-empty');
  if(ph) ph.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  if(who === 'user'){
    el.textContent = text;
  }else{
    el.innerHTML = `<div class="av">M</div><div class="bubble">${text}</div>`;
  }
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

function addTyping(){
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `<div class="av">M</div><div class="typing"><i></i><i></i><i></i></div>`;
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}

function flash(el){
  if(!el) return;
  el.classList.add('flash');
  clearTimeout(el._ft);
  el._ft = setTimeout(()=> el.classList.remove('flash'), 1500);
}

function bindMsg(el){
  el.classList.add('sel');
  el.title = '这句话是上面几步调用换来的 · 点一下高亮对应卡片';
  el.onclick = ()=>{
    const cards = el._cards || [];
    if(!cards.length) return;
    cards.forEach(c=>{
      c.classList.add('hl');
      clearTimeout(c._ht);
      c._ht = setTimeout(()=> c.classList.remove('hl'), 1600);
    });
    cards[0].scrollIntoView({block:'center',behavior:'smooth'});
  };
}

function fmtJSON(obj){
  let s = JSON.stringify(obj, null, 2)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;');
  s = s.replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:');
  s = s.replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>');
  return s;
}

function argvOf(params){
  const ks = Object.keys(params);
  if(!ks.length) return '（无入参）';
  return ks.slice(0,4).map(k=>{
    let v = params[k];
    if(Array.isArray(v)) v = `[${v.length}]`;
    else if(typeof v === 'object' && v !== null) v = '{…}';
    else if(typeof v === 'string' && v.length > 18) v = v.slice(0,18) + '…';
    return `${k}=${v}`;
  }).join('  ');
}

function addToolCard(step, idx, total){
  const t = TOOL_MAP[step.tool] || {cat:'store', desc:''};
  const color = CATS[t.cat].color;
  const wrap = document.createElement('div');
  wrap.className = 'tcard running';
  wrap.style.setProperty('--c', color);
  wrap.dataset.tool = step.tool;
  wrap.innerHTML = `
    <div class="dot"><svg width="8" height="8" viewBox="0 0 10 10"><path d="M1.5 5.2l2.2 2.2L8.5 2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="card running">
      <div class="card-top">
        <code>${step.tool}</code>
        <span class="pill">${CATS[t.cat].name}</span>
        <span class="lat"><span class="spin"></span>调用中</span>
      </div>
      <div class="argv">${argvOf(step.params)}</div>
      <div class="note">${step.note}</div>
      <div class="json"><span class="lbl">PARAMS</span>${fmtJSON(step.params)}<span class="lbl" style="margin-top:9px">RESPONSE</span>${fmtJSON(step.result)}</div>
    </div>`;
  const card = wrap.querySelector('.card');
  wrap.querySelector('.card-top').onclick = ()=>{
    card.classList.toggle('open');
    flash(wrap._msg);
  };
  tlEl.appendChild(wrap);
  tlEl.scrollTop = tlEl.scrollHeight;
  return wrap;
}

function finishCard(wrap, latency){
  wrap.classList.remove('running');
  wrap.classList.add('done');
  const card = wrap.querySelector('.card');
  card.classList.remove('running');
  card.classList.add('done');
  card.querySelector('.lat').innerHTML = `<span class="ok">✓</span>${latency}ms`;
}

function updateStats(){
  $('s-calls').textContent = called;
  $('s-cov').textContent = `${calledSet.size}/35`;
  $('s-lat').textContent = latSum >= 1000 ? (latSum/1000).toFixed(1) + 's' : latSum + 'ms';
  $('mx-cov').textContent = `已点亮 ${calledSet.size} / 35`;
}

function doneCard(s){
  const div = document.createElement('div');
  div.className = 'done-card';
  div.innerHTML = `
    <div class="dt">链路完成</div>
    <div class="dstat">${called} 次调用 · 覆盖 ${calledSet.size}/35 能力 · 累计 ${latSum}ms</div>
    <div class="dtxt">${s.outcome}</div>`;
  tlEl.appendChild(div);
  tlEl.scrollTop = tlEl.scrollHeight;
}

/* ---------------- runner ---------------- */
function wait(ms){
  return new Promise(res=> setTimeout(res, ms));
}

async function sleep(ms){ await wait(ms / speed); }

async function play(){
  if(playing) return;
  playing = true;
  const myToken = ++runToken;
  $('btn-play').textContent = '重播';

  const s = SCENARIOS[cur];
  const toolSteps = s.steps.filter(x=> x.tool);
  let ti = 0;
  let pending = [];
  let lastUser = null;

  for(const step of s.steps){
    if(myToken !== runToken) return;

    if(step.who === 'user'){
      lastUser = addMsg('user', step.text);
      pending = [];
      $('chat-meta').textContent = '用户在说话';
      await sleep(520);
    }else if(step.who === 'bot'){
      $('chat-meta').textContent = 'Agent 回复';
      const t = addTyping();
      await sleep(360);
      if(myToken !== runToken) return;
      t.remove();
      const el = addMsg('bot', step.text);
      el._cards = pending.slice();
      pending.forEach(c=> c._msg = el);
      pending = [];
      bindMsg(el);
      await sleep(420);
    }else{
      ti++;
      $('chat-meta').textContent = `执行 ${step.tool}`;
      $('flow-meta').textContent = `${ti} / ${toolSteps.length}`;
      const wrap = addToolCard(step, ti, toolSteps.length);
      pending.push(wrap);
      const latency = 70 + ((step.tool.length * 37 + ti * 53) % 260);
      await sleep(330);
      if(myToken !== runToken) return;
      finishCard(wrap, latency);
      called++; latSum += latency;
      aggCalls++; aggLat += latency;
      calledSet.add(step.tool);
      const chip = chipsEl.querySelector(`.chip[data-id="${step.tool}"]`);
      if(chip) chip.classList.add('on');
      updateStats();
      await sleep(260);
    }
  }

  if(myToken !== runToken) return;
  doneCard(s);
  $('chat-meta').textContent = '链路完成';
  $('flow-meta').textContent = `${toolSteps.length} / ${toolSteps.length}`;
  playing = false;
  $('btn-play').textContent = '重播';
}

async function runScenario(i, focusTool){
  cur = i;
  syncActiveTab();
  clearForRun();
  if(focusTool){
    setTimeout(()=>{
      const el = tlEl.querySelector(`.tcard[data-tool="${focusTool}"]`);
      if(el){ el.style.outline = '2px solid rgba(255,199,44,.45)'; el.scrollIntoView({block:'center',behavior:'smooth'}); }
    }, 1400);
  }
  await play();
}

let chainToken = 0;

function select(i, focusTool){
  runToken++;
  playing = false;
  aggCalls = 0; aggLat = 0;
  const my = ++chainToken;
  setTimeout(()=>{ if(my === chainToken) runScenario(i, focusTool); }, 40);
}

function renderReport(){
  const rows = SCENARIOS.map(s=>({
    name: s.name,
    n: s.steps.filter(x=> x.tool).length
  }));
  const total = rows.reduce((a,r)=> a + r.n, 0);
  const max = Math.max(...rows.map(r=> r.n));
  tlEl.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'report';
  div.innerHTML = `
    <div class="rp-eyebrow">全流程演示 · 7 个场景</div>
    <h2 class="rp-title">35 个接口，被完整编排了一遍</h2>
    <div class="rp-kpis">
      <div class="kpi"><b>7</b><span>业务场景</span></div>
      <div class="kpi"><b>35</b><span>接口覆盖</span></div>
      <div class="kpi"><b>${total}</b><span>调用次数</span></div>
      <div class="kpi"><b>9</b><span>能力分类</span></div>
    </div>
    <div class="rp-bars">
      ${rows.map(r=>`
        <div class="bar-row">
          <span class="bn">${r.name}</span>
          <span class="bt"><i style="width:${(r.n / max * 100).toFixed(1)}%"></i></span>
          <span class="bv">${r.n}</span>
        </div>`).join('')}
    </div>
    <div class="rp-foot">每个场景都是一条真实的业务链路：找店 → 选品 → 算价 → 下单 → 售后，接口之间存在强顺序依赖。</div>`;
  tlEl.appendChild(div);
  const lat = aggLat >= 1000 ? (aggLat/1000).toFixed(1) + 's' : aggLat + 'ms';
  $('s-calls').textContent = aggCalls;
  $('s-lat').textContent = lat;
  $('s-cov').textContent = calledSet.size + '/35';
  chatEl.innerHTML = `
    <div class="chat-closing">
      <div class="cc-t">演示结束</div>
      <div class="cc-b">7 个场景串起了从「找店」到「售后」的完整生命周期。<br>右侧是整体战报，下方 35 个芯片已全部点亮。</div>
    </div>`;
  $('chat-meta').textContent = '全部完成';
  tabsEl.querySelectorAll('.tab').forEach(b=> b.classList.remove('active'));
  $('flow-meta').textContent = `7 / 7 场景`;
  $('flow-desc').textContent = '全部接口已覆盖';
}

async function runAll(){
  const my = ++chainToken;
  aggCalls = 0; aggLat = 0;
  const prevSpeed = speed;
  speed = 9;
  $('btn-speed').textContent = '9x';
  $('btn-speed').classList.add('on');
  for(let i=0;i<SCENARIOS.length;i++){
    if(my !== chainToken) break;
    await runScenario(i);
    await wait(320);
  }
  speed = prevSpeed;
  $('btn-speed').textContent = prevSpeed + 'x';
  $('btn-speed').classList.toggle('on', prevSpeed > 1);
  if(my === chainToken) renderReport();
}

$('btn-play').onclick = ()=> select(cur);
$('btn-all').onclick = ()=> runAll();
$('btn-speed').onclick = e=>{
  speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  e.target.textContent = speed + 'x';
  e.target.classList.toggle('on', speed > 1);
};

/* ---------------- init ---------------- */
buildTabs();
buildChips();
syncActiveTab();
$('flow-desc').textContent = SCENARIOS[0].desc;
$('flow-meta').textContent = '0 / ' + SCENARIOS[0].steps.filter(x=>x.tool).length;
setTimeout(()=> play(), 700);
</script>
</body>
</html>
