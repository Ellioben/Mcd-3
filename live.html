<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门点餐派 · 真实数据对接</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --surface:#FFFFFF; --surface2:#F7F2EA; --surface3:#FFF6D6;
    --line:#F0E7D8; --line2:#E4D5BF; --text:#27251F; --muted:#5A554C; --dim:#9B9186;
    --red:#DA291C; --red-dark:#B32016; --yellow:#FFC72C; --yellow-dark:#E6A800;
    --green:#2E8B57; --gold-ink:#8A6100;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:'Nunito',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --r-md:16px; --r-lg:22px; --r-pill:999px;
    --sh-sm:0 2px 10px rgba(120,80,20,.07); --sh-md:0 8px 24px rgba(120,80,20,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;box-shadow:var(--sh-sm)}
  .hrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:14px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{width:34px;height:auto}
  .brand h1{font-size:15px;font-weight:800}
  .brand p{font-size:10.5px;color:var(--dim);margin-top:2px;font-weight:600}
  .conn{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--muted);
    background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 12px}
  .pulse{width:8px;height:8px;border-radius:50%;background:#C9C2B5;animation:pulse 1.6s ease-in-out infinite}
  .conn.ok .pulse{background:var(--green)}
  .conn.bad .pulse{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:20px 22px;margin:18px 0;box-shadow:var(--sh-sm)}
  .step h2{font-size:14px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:13px}
  .step h2 .no{width:22px;height:22px;border-radius:7px;background:var(--yellow);color:#3D3200;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .step .hint{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:9px;line-height:1.7}

  .frow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  input[type=text]{font:inherit;font-size:13px;font-weight:700;padding:9px 13px;border:1.5px solid var(--line2);
    border-radius:var(--r-pill);background:#fff;outline:none;min-width:120px}
  input[type=text]:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,199,44,.22)}
  .btn{font:inherit;font-size:13px;font-weight:900;padding:9px 18px;border-radius:var(--r-pill);cursor:pointer;
    background:var(--yellow);border:1.5px solid var(--yellow);color:#3D3200;transition:.15s}
  .btn:hover{background:var(--yellow-dark);border-color:var(--yellow-dark)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;border-color:var(--line2);color:var(--muted)}
  .btn.ghost:hover{border-color:var(--yellow-dark)}

  .coord{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--gold-ink);
    background:var(--surface3);border:1px solid var(--line2);border-radius:10px;padding:8px 12px}

  .stores{display:grid;gap:8px;margin-top:6px}
  .store{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:var(--r-md);background:#fff;cursor:pointer;transition:.15s}
  .store:hover{border-color:var(--yellow-dark);transform:translateY(-1px)}
  .store.on{border-color:var(--yellow);background:var(--surface3);box-shadow:0 0 0 3px rgba(255,199,44,.25)}
  .store .nm{font-size:13.5px;font-weight:800;flex:1;min-width:0}
  .store .addr{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}
  .store .meta{font-size:10.5px;color:var(--muted);font-weight:700;text-align:right;flex-shrink:0;font-family:var(--mono)}
  .store .meta b{color:var(--gold-ink)}

  .meals-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .cat{font-size:12px;font-weight:900;color:var(--gold-ink);margin:16px 0 7px;
    border-left:3px solid var(--yellow);padding-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
  .meal{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s}
  .meal:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--line2)}
  .meal .img{width:100%;aspect-ratio:1.9;display:flex;align-items:center;justify-content:center;background:#FFF6E6}
  .meal .img img{max-width:86%;max-height:86%;object-fit:contain}
  .meal .bd{padding:9px 11px 11px}
  .meal .nm{font-size:12.5px;font-weight:800;line-height:1.3}
  .meal .tags{font-size:9.5px;color:var(--dim);font-weight:700;margin-top:3px;min-height:12px}
  .meal .pr{display:flex;align-items:baseline;gap:5px;margin-top:5px}
  .meal .pr b{font-size:14px;color:var(--red);font-weight:900;font-family:var(--mono)}
  .meal .pr s{font-size:10.5px;color:var(--dim);font-weight:600}
  .meal .nut{font-size:10px;color:var(--muted);font-weight:700;margin-top:4px;font-family:var(--mono)}

  details{margin-top:14px}
  summary{cursor:pointer;font-size:11.5px;font-weight:800;color:var(--muted);user-select:none}
  pre{background:#2B241B;color:#F5EEDC;border-radius:12px;padding:14px 16px;font-size:11px;
    overflow:auto;max-height:340px;margin-top:8px;font-family:var(--mono);line-height:1.6}
  .err{background:#FDEBE9;border:1px solid #F2C7C2;color:var(--red-dark);border-radius:12px;
    padding:11px 14px;font-size:12px;font-weight:700;margin-top:10px;white-space:pre-wrap}
  .spin{color:var(--dim);font-size:12px;font-weight:700;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="brand">
        <img src="assets/mcd-arches.svg" alt="麦当劳">
        <div>
          <h1>麦门点餐派</h1>
          <p>直连 mcp.mcd.cn · 定位 → 门店 → 真实餐品</p>
        </div>
      </div>
      <div class="conn" id="conn"><span class="pulse"></span><span id="connText">未连接</span></div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="step">
    <h2><span class="no">1</span>获取当前位置</h2>
    <div class="frow">
      <button class="btn" id="geoBtn">📍 获取我的位置</button>
      <span class="coord" id="coord">尚未定位</span>
      <input type="text" id="city" value="西安" placeholder="城市">
      <input type="text" id="kw" value="京东MALL" placeholder="位置关键词">
    </div>
    <p class="hint">浏览器定位只给经纬度；门店接口按「城市 + 关键词」搜索（MCP 不支持坐标入参）。定位成功后按城市把关键词改成你的位置即可。</p>
  </div>

  <div class="step">
    <h2><span class="no">2</span>查门店（query-nearby-stores）</h2>
    <div class="frow">
      <button class="btn" id="storeBtn">查附近门店</button>
      <span class="spin" id="storeStatus"></span>
    </div>
    <div class="stores" id="stores"></div>
  </div>

  <div class="step">
    <h2><span class="no">3</span>拉真实餐品（query-meals + list-nutrition-foods）</h2>
    <div class="meals-head">
      <div class="frow">
        <button class="btn" id="mealBtn" disabled>拉取该店餐品</button>
        <button class="btn ghost" id="nutritionBtn" disabled>只看营养表</button>
      </div>
      <span class="spin" id="mealStatus"></span>
    </div>
    <div id="meals"></div>
    <div id="mealErr"></div>
  </div>

  <div class="step">
    <h2>📜 原始返回</h2>
    <details id="rawWrap" style="display:none">
      <summary>展开 / 收起（最后一次调用的完整 JSON）</summary>
      <pre id="raw"></pre>
    </details>
  </div>

</div>

<script>
/* ============================================================
   MCP 直连层：streamablehttp + JSON-RPC tools/call
   - 先试浏览器直连 mcp.mcd.cn（若服务端补了 CORS 头就能用）
   - 失败自动切本地代理 http://127.0.0.1:8787（node live-proxy.mjs）
   ============================================================ */
const MCP_URL   = 'https://mcp.mcd.cn';
const MCP_TOKEN = 'Bearer mOMLLKPQsweEhKRnsR67f7v48DWVRv4B';
const PROXY_URL = 'http://127.0.0.1:8787/mcp';
let channel = null;   // 'direct' | 'proxy'

const $ = id => document.getElementById(id);

function setConn(state, text){
  const el = $('conn');
  el.className = 'conn' + (state ? ' ' + state : '');
  $('connText').textContent = text;
}

function parseRpc(text){
  // 兼容 SSE（text/event-stream）与纯 JSON 两种返回
  let payload = text;
  if(/^data:/m.test(text) && !text.trim().startsWith('{')){
    payload = text.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\n');
  }
  const r = JSON.parse(payload);
  if(r.error) throw new Error(r.error.message || JSON.stringify(r.error));
  const t = r.result.content[0].text;
  const i = t.indexOf('{"success"');
  if(i < 0) throw new Error('返回里没有业务 JSON：' + t.slice(0, 120));
  // 业务 JSON 后面还可能跟 markdown 尾巴，按括号配对剥出完整对象
  let depth = 0, inStr = false, esc = false, end = -1;
  for(let j = i; j < t.length; j++){
    const c = t[j];
    if(inStr){ if(esc) esc = false; else if(c === '\\') esc = true; else if(c === '"') inStr = false; continue; }
    if(c === '"'){ inStr = true; continue; }
    if(c === '{') depth++;
    else if(c === '}'){ depth--; if(depth === 0){ end = j + 1; break; } }
  }
  if(end < 0) throw new Error('业务 JSON 不完整');
  return { raw: JSON.parse(t.slice(i, end)), markdown: t.slice(0, i).trim() };
}

async function rpc(body, url){
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json, text/event-stream',
      ...(url === MCP_URL ? { 'Authorization': MCP_TOKEN } : {}),
    },
    body: JSON.stringify(body),
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

let rpcId = 0;
async function call(tool, args){
  const body = { jsonrpc:'2.0', id: ++rpcId, method:'tools/call', params:{ name: tool, arguments: args } };
  let text;
  if(channel === 'proxy'){
    text = await rpc(body, PROXY_URL);
  }else{
    try{
      text = await rpc(body, MCP_URL);
      if(channel !== 'direct'){ channel = 'direct'; setConn('ok', '已直连 mcp.mcd.cn'); }
    }catch(e){
      // 浏览器跨域被拦（没有 ACAO 头）→ 自动切本地代理
      text = await rpc(body, PROXY_URL);
      if(channel !== 'proxy'){ channel = 'proxy'; setConn('ok', '经本地代理 127.0.0.1:8787（直连被 CORS 拦）'); }
    }
  }
  const out = parseRpc(text);
  $('rawWrap').style.display = '';
  $('raw').textContent = JSON.stringify(out.raw, null, 2);
  return out.raw;
}

/* ---------- Step 1: 定位 ---------- */
$('geoBtn').onclick = () => {
  if(!navigator.geolocation){ $('coord').textContent = '浏览器不支持定位'; return; }
  $('coord').textContent = '定位中…';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      $('coord').textContent = `经度 ${longitude.toFixed(5)} · 纬度 ${latitude.toFixed(5)} · 精度 ±${Math.round(accuracy)}m`;
    },
    err => { $('coord').textContent = '定位失败：' + err.message; },
    { timeout: 10000 }
  );
};

/* ---------- Step 2: 门店 ---------- */
let curStore = null;
$('storeBtn').onclick = async () => {
  const city = $('city').value.trim(), kw = $('kw').value.trim();
  if(!city || !kw){ alert('城市和关键词都要填'); return; }
  $('storeBtn').disabled = true;
  $('storeStatus').textContent = '查询中…';
  $('stores').innerHTML = '';
  try{
    const d = await call('query-nearby-stores', { beType: 1, searchType: 2, city, keyword: kw });
    const list = d.data || [];
    $('storeStatus').textContent = `找到 ${list.length} 家`;
    $('stores').innerHTML = list.map((s, i) => `
      <div class="store" data-i="${i}">
        <div class="nm">${esc(s.storeName)}<div class="addr">${esc(s.address || '')}</div></div>
        <div class="meta"><b>${s.storeCode}</b><br>${s.distance != null ? '距离 ' + s.distance + 'm' : ''}<br>${(s.businessStartTime||'') + '-' + (s.businessEndTime||'')}</div>
      </div>`).join('');
    $('stores').querySelectorAll('.store').forEach(el => {
      el.onclick = () => {
        $('stores').querySelectorAll('.store').forEach(x => x.classList.remove('on'));
        el.classList.add('on');
        curStore = list[+el.dataset.i];
        $('mealBtn').disabled = false;
        $('mealBtn').textContent = `拉取「${curStore.storeName.replace(/麦当劳|餐厅/g, '')}」的餐品`;
      };
    });
  }catch(e){
    $('storeStatus').textContent = '';
    $('stores').innerHTML = `<div class="err">${esc(e.message)}\n\n若提示代理连接失败：在 mcd 目录跑 node live-proxy.mjs 后刷新。</div>`;
  }finally{
    $('storeBtn').disabled = false;
  }
};

/* ---------- Step 3: 餐品 + 营养 ---------- */
$('nutritionBtn').onclick = async () => {
  $('nutritionBtn').disabled = true;
  try{
    const d = await call('list-nutrition-foods', {});
    const rows = findNutritionRows(d);
    alert(`营养表 ${rows.length} 条，见原始返回`);
  }catch(e){ alert(e.message); }
  $('nutritionBtn').disabled = false;
};

/* 营养返回的 data 形态不固定（可能是字符串/数组），递归找含 productName 的数组 */
function findNutritionRows(d){
  const stack = [d];
  while(stack.length){
    const cur = stack.pop();
    if(Array.isArray(cur) && cur.length && cur[0] && (cur[0].productName || cur[0].name) && ('energyKcal' in cur[0])) return cur;
    if(cur && typeof cur === 'object') Object.values(cur).forEach(v => stack.push(v));
  }
  return [];
}

$('mealBtn').onclick = async () => {
  if(!curStore) return;
  $('mealBtn').disabled = true;
  $('mealStatus').textContent = '拉取餐品 + 营养表…';
  $('meals').innerHTML = ''; $('mealErr').innerHTML = '';
  try{
    const [meals, nutri] = await Promise.all([
      call('query-meals', { storeCode: curStore.storeCode, orderType: 1, beType: 1 }),
      call('list-nutrition-foods', {}),
    ]);
    const byName = {};
    findNutritionRows(nutri).forEach(n => { byName[n.productName || n.name] = n; });
    renderMeals(meals, byName);
  }catch(e){
    $('mealErr').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }finally{
    $('mealStatus').textContent = '';
    $('mealBtn').disabled = false;
  }
};

function renderMeals(d, byName){
  const meals = (d.data && d.data.meals) || {};
  const cats  = (d.data && d.data.categories) || [];
  const shown = {};
  let html = '';
  cats.forEach(cat => {
    const items = (cat.meals || []).map(m => meals[m.code]).filter(Boolean).filter(m => {
      if(shown[m.code || m.name]) return false;
      shown[m.code || m.name] = true;
      return true;
    });
    if(!items.length) return;
    html += `<div class="cat">${esc(cat.name)} · ${items.length} 款</div><div class="grid">` +
      items.map(m => {
        const tags = (m.tags || []).slice(0, 2).join(' · ');
        const n = byName[m.name];
        const cur = parseFloat(m.currentPrice), orig = parseFloat(m.originalPrice);
        return `<div class="meal">
          <div class="img">${m.image ? `<img src="${esc(m.image)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</div>
          <div class="bd">
            <div class="nm">${esc(m.name)}</div>
            <div class="tags">${esc(tags)}</div>
            <div class="pr"><b>¥${isFinite(cur) ? cur : '?'}</b>${orig > cur ? `<s>¥${orig}</s>` : ''}</div>
            <div class="nut">${n ? Math.round(n.energyKcal) + ' 大卡 · 蛋白 ' + n.protein + 'g' : ''}</div>
          </div>
        </div>`;
      }).join('') + '</div>';
  });
  const total = Object.keys(meals).length;
  $('meals').innerHTML = html || '<p class="hint">该店返回了 0 款餐品。</p>';
  $('mealStatus').textContent = `共 ${total} 款 · ${cats.length} 个分类`;
  $('nutritionBtn').disabled = false;
}

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

/* ---------- 启动：tools/list 探活 ---------- */
(async () => {
  const body = { jsonrpc:'2.0', id: 0, method:'tools/list', params:{} };
  try{
    const t = await rpc(body, MCP_URL);
    channel = 'direct';
    const tools = JSON.parse(t).result.tools.length;
    setConn('ok', `已直连 mcp.mcd.cn · ${tools} 个工具`);
  }catch(e){
    try{
      const t = await rpc(body, PROXY_URL);
      channel = 'proxy';
      const tools = JSON.parse(t).result.tools.length;
      setConn('ok', `经本地代理 127.0.0.1:8787 · ${tools} 个工具`);
    }catch(e2){
      setConn('bad', '连不上：' + e2.message.slice(0, 60));
    }
  }
})();
</script>
</body>
</html>
